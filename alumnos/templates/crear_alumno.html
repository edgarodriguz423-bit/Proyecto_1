{% extends 'base.html' %}

{% block titulo %}Registrar alumno | Mi Escuela{% endblock %}

{% block contenido %}
<div class="page-header">
    <a href="{% url 'lista_alumnos' %}" class="btn-back">
        <i class="bi bi-arrow-left"></i> Volver a lista
    </a>
    <h1 class="page-title">Nuevo alumno</h1>
</div>

<section class="form-card">
    <div class="form-card-header">
        <div class="form-card-icon">
            <i class="bi bi-person-plus-fill"></i>
        </div>
        <div>
            <p class="form-card-title">Registrar alumno</p>
            <p class="form-card-subtitle">Completa los datos del nuevo alumno.</p>
        </div>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="form-card-body">
            {{ formulario.as_p }}
        </div>
        <div class="form-card-footer">
            <a href="{% url 'lista_alumnos' %}" class="btn btn-outline-secondary">
                Cancelar
            </a>
            <button type="submit" class="btn-save">
                <i class="bi bi-check-lg"></i> Guardar alumno
            </button>
        </div>
    </form>
</section>
{% endblock %}
